<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="40" fill="#6366f1"/>
  
  <!-- Box body -->
  <rect x="44" y="80" width="104" height="76" rx="6" fill="none" stroke="white" stroke-width="8"/>
  
  <!-- Box lid top -->
  <rect x="36" y="62" width="120" height="22" rx="5" fill="white" opacity="0.95"/>
  
  <!-- Box lid center line -->
  <rect x="84" y="62" width="24" height="22" rx="3" fill="#6366f1" opacity="0.5"/>
  
  <!-- Up arrow (mượn) -->
  <path d="M78 108 L96 88 L114 108" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="96" y1="88" x2="96" y2="136" stroke="white" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Small down arrow (trả) -->
  <path d="M120 125 L128 133 L136 125" fill="none" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="128" y1="110" x2="128" y2="133" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/>
