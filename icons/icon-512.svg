<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="#6366f1"/>
  
  <!-- Outer glow / soft inner shadow effect -->
  <rect width="512" height="512" rx="100" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>
  </defs>

  <!-- Box body -->
  <rect x="116" y="210" width="280" height="200" rx="16" fill="none" stroke="white" stroke-width="20"/>

  <!-- Box lid -->
  <rect x="96" y="162" width="320" height="58" rx="14" fill="white" opacity="0.95"/>
  <!-- Lid bow/handle -->
  <rect x="220" y="162" width="72" height="58" rx="10" fill="#6366f1" opacity="0.45"/>

  <!-- Vertical stripe on body -->
  <rect x="246" y="210" width="20" height="200" fill="white" opacity="0.12"/>

  <!-- Up arrow (mượn) -->
  <path d="M206 290 L256 230 L306 290" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="256" y1="230" x2="256" y2="368" stroke="white" stroke-width="22" stroke-linecap="round"/>

  <!-- Down arrow small (trả) - bottom right -->
  <path d="M330 335 L354 358 L378 335" fill="none" stroke="#a5b4fc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="354" y1="295" x2="354" y2="358" stroke="#a5b4fc" stroke-width="14" stroke-linecap="round"/>
</svg>
